plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.admin.digitearn'
    compileSdk 34

    defaultConfig {
        applicationId "com.admin.digitearn"
        minSdk 24          // Android 7.0+ (প্রায় সব phone চলবে)
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// কোনো external dependency নেই — শুধু platform WebView (build fail হওয়ার chance ন্যূনতম)
dependencies {
}
