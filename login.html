<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>লগইন করুন | DigitEarn — আপনার ড্যাশবোর্ডে প্রবেশ করুন</title>
<meta name="description" content="DigitEarn-এ লগইন করে আপনার ড্যাশবোর্ড দেখুন, টাস্ক সম্পন্ন করুন এবং রিওয়ার্ড ক্লেইম করুন।">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://digitearn.vercel.app/login.html">
<link rel="icon" type="image/png" href="/favicon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="DigitEarn">
<meta property="og:locale" content="bn_BD">
<meta property="og:title" content="লগইন করুন | DigitEarn">
<meta property="og:description" content="DigitEarn-এ লগইন করে টাস্ক করুন, রিওয়ার্ড ক্লেইম করুন।">
<meta property="og:url" content="https://digitearn.vercel.app/login.html">
<meta property="og:image" content="https://digitearn.vercel.app/logo.png">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="phone auth-page">
  <div class="auth-wrap">
    <div class="tab-switch">
      <a href="/login.html" class="active">লগইন</a>
      <a href="/register.html">সাইন আপ</a>
    </div>
    <div class="auth-card">
      <img src="/logo.png" alt="DigitEarn লোগো" class="auth-logo">
      <h1 class="auth-title">স্বাগতম</h1>
      <p class="auth-sub">ড্যাশবোর্ডে ঢুকতে লগইন করুন</p>
      <div id="loginError"></div>
      <form id="loginForm" method="post" action="#">
        <div class="field">
          <div class="field-box">
<i class="fa-solid fa-envelope left"></i>
          <input type="email" name="email" placeholder="ইমেইল ঠিকানা" required autocomplete="email">
          </div>
          
        </div>
        <div class="field">
          <div class="field-box">
<i class="fa-solid fa-lock left"></i>
          <input type="password" name="password" placeholder="পাসওয়ার্ড" required autocomplete="current-password">
          <button type="button" class="eye" tabindex="-1"><i class="fa-solid fa-eye"></i></button>
          </div>
          
        </div>
        <div class="login-row">
          <label class="check-label"><input type="checkbox" id="keepLogin" checked> আমাকে মনে রেখো</label>
          <a href="/forgot-password.html" class="forgot-link">পাসওয়ার্ড ভুলে গেছেন?</a>
        </div>
        <button type="submit" class="btn btn-gold btn-block">নিরাপদে লগইন করুন i class="fa-solid fa-shield-halved"></i></button>
      </form>
      <p class="auth-switch">নতুন আমাদের প্ল্যাটফর্মে? <a href="/register.html">অ্যাকাউন্ট খুলুন</a></p>
    </div>
    <div class="powered-by">DigitEarn পরিচালনায়</div>
    <p class="dev-credit"><b>ডেভেলপার:</b> Ami Sayem • <a href="mailto:support.amisayem@gmail.com">support.amisayem@gmail.com</a></p>
  </div>
</div>
<script type="module" src="/src/pages/login.js"></script>
</body>
</html>
