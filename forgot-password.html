<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>পাসওয়ার্ড ভুলে গেছেন? | DigitEarn</title>
<meta name="description" content="DigitEarn-এ পাসওয়ার্ড ভুলে গেছেন? আপনার ইমেইলে পাসওয়ার্ড রিসেট লিংক পাঠিয়ে দিন।">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://digitearn.vercel.app/forgot-password.html">
<link rel="icon" type="image/png" href="/favicon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="DigitEarn">
<meta property="og:locale" content="bn_BD">
<meta property="og:title" content="পাসওয়ার্ড ভুলে গেছেন? | DigitEarn">
<meta property="og:url" content="https://digitearn.vercel.app/forgot-password.html">
<meta property="og:image" content="https://digitearn.vercel.app/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="phone auth-page">
  <div class="auth-wrap" style="padding-top:48px">
    <div class="tab-switch" style="pointer-events:none">
      <a href="/login.html" class="active">লগইন</a>
      <a href="/register.html">সাইন আপ</a>
    </div>
    <div class="auth-card">
      <h1 class="auth-title">পাসওয়ার্ড রিসেট</h1>
      <p class="auth-sub">আপনার ইমেইলে পাসওয়ার্ড রিসেট লিংক পাঠান হবে</p>
      <form id="forgotForm" method="post" action="#">
        <div class="field">
          <div class="field-box">
<i class="fa-solid fa-envelope left"></i>
          <input type="email" name="email" placeholder="আপনার অ্যাকাউন্টের ইমেইল" required autocomplete="email">
          </div>
          
        </div>
        <button type="submit" class="btn btn-gold btn-block"><i class="fa-solid fa-paper-plane"></i> রিসেট লিংক পাঠান</button>
      </form>
      <div id="forgotDone" style="margin-top:14px"></div>
      <div id="forgotError" style="margin-top:14px"></div>
      <div class="back-link" style="margin-top:18px"><a href="/login.html"><i class="fa-solid fa-arrow-left"></i> লগইন পেজে ফিরে যান</a></div>
    </div>
  </div>
</div>
<script type="module" src="/src/pages/forgot.js"></script>
</body>
</html>
